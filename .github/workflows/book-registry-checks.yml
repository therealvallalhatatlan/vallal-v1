name: Book registry checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/api/book-registry/**"
      - "app/api/admin/book-registry/**"
      - "app/api/checkout/route.ts"
      - "app/api/webhook/stripe/route.ts"
      - "components/book-registry/**"
      - "components/matrica/MapView.tsx"
      - "db/migrations/054_book_registry.sql"
      - "db/migrations/055_book_registry_account_deletion.sql"
      - "lib/bookRegistry.ts"
      - "lib/bookRegistry.test.ts"
      - "lib/bookRegistryTokens.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/book-registry-checks.yml"
  push:
    branches:
      - feat/book-registry-map
    paths:
      - "app/api/book-registry/**"
      - "app/api/admin/book-registry/**"
      - "app/api/checkout/route.ts"
      - "app/api/webhook/stripe/route.ts"
      - "components/book-registry/**"
      - "components/matrica/MapView.tsx"
      - "db/migrations/054_book_registry.sql"
      - "db/migrations/055_book_registry_account_deletion.sql"
      - "lib/bookRegistry.ts"
      - "lib/bookRegistry.test.ts"
      - "lib/bookRegistryTokens.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/book-registry-checks.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Book registry unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run book registry tests
        run: pnpm test:book-registry
